<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <!-- Fondo circular -->
    <circle cx="100" cy="100" r="90" fill="#2c3e50"/>
    
    <!-- Cruz médica -->
    <g fill="#3498db">
        <rect x="85" y="50" width="30" height="100" rx="5"/>
        <rect x="50" y="85" width="100" height="30" rx="5"/>
    </g>
    
    <!-- Diente estilizado -->
    <path d="M100 70 C120 70, 130 80, 130 100 C130 120, 120 130, 100 130 C80 130, 70 120, 70 100 C70 80, 80 70, 100 70" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="8"
          stroke-linecap="round"/>
    
    <!-- Texto circular -->
    <path id="textPath" 
          d="M100,30 A70,70 0 1,1 99.9,30"
          fill="none"/>
    <text fill="#ffffff" font-family="Arial" font-size="16">
        <textPath href="#textPath" startOffset="25%">
            CONSULTORIO ODONTOLÓGICO
        </textPath>
    </text>
</svg>