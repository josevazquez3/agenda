{% extends 'base.html' %}
{% load static %}

{% block title %}Sesión Cerrada{% endblock %}

{% block extra_js %}
<script src="{% static 'js/logout.js' %}"></script>
{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body text-center">
                    <h2 class="card-title mb-4">¡Hasta pronto!</h2>
                    <p class="card-text">Has cerrado sesión correctamente.</p>
                    <a href="{% url 'login' %}" class="btn btn-primary">Volver a iniciar sesión</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
